<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#12100E"/>

  <!-- Outer ring (gold) -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#C5A059" stroke-width="2"/>

  <!-- Aperture blades (6 blades) -->
  <!-- Blade 1 - top right -->
  <path d="M32 10 L44 20 L36 32 Z" fill="#C5A059" opacity="0.9"/>
  <!-- Blade 2 - right -->
  <path d="M54 32 L44 44 L32 36 Z" fill="#C5A059" opacity="0.75"/>
  <!-- Blade 3 - bottom right -->
  <path d="M44 54 L32 54 L28 40 Z" fill="#C5A059" opacity="0.9"/>
  <!-- Blade 4 - bottom left -->
  <path d="M20 54 L10 44 L24 32 Z" fill="#C5A059" opacity="0.75"/>
  <!-- Blade 5 - left -->
  <path d="M10 32 L20 20 L32 28 Z" fill="#C5A059" opacity="0.9"/>
  <!-- Blade 6 - top left -->
  <path d="M20 10 L32 10 L36 24 Z" fill="#C5A059" opacity="0.75"/>

  <!-- Center circle (dark cutout) -->
  <circle cx="32" cy="32" r="10" fill="#12100E"/>

  <!-- Inner lens highlight -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#C5A059" stroke-width="1.5" opacity="0.6"/>

  <!-- Tiny center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#C5A059"/>
</svg>